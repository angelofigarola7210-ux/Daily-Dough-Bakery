<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Daily Dough Bakery</title>

  <link rel="stylesheet" href="checkout.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Dancing+Script&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

  <div class="nav-logo">
    Daily Dough Bakery
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="recipes.html">Recipes</a>
    <a href="about.html">About</a>
  </div>

</nav>

<!-- CHECKOUT -->
<div class="checkout">

  <!-- ORDER SUMMARY -->
  <div class="summary">

    <h2>Your Order</h2>

    <div id="orderItems"></div>

    <div class="total">
      <h3 id="orderTotal">Total: $0</h3>
    </div>

  </div>

  <!-- PAYMENT -->
  <div class="payment">

    <h2>Secure Checkout</h2>

    <p class="checkout-subtitle">
      Complete your artisan bakery order
    </p>

    <!-- CUSTOMER INFO -->
    <div class="input-group">

      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe">

    </div>

    <div class="input-group">

      <label>Email Address</label>
      <input type="email" id="email" placeholder="example@email.com">

    </div>

    <!-- DELIVERY -->
    <h3>Order Type</h3>

    <div class="delivery-options">

      <label class="delivery-card">

        <input
          type="radio"
          name="deliveryType"
          value="pickup"
          checked
        >

        <span>🏪 Pickup</span>

      </label>

      <label class="delivery-card">

        <input
          type="radio"
          name="deliveryType"
          value="delivery"
        >

        <span>🚚 Delivery (+$5)</span>

      </label>

    </div>

    <!-- DELIVERY INFO -->
    <div id="deliveryInfo" class="hidden">

      <div class="input-group">

        <label>Delivery Address</label>

        <input
          type="text"
          id="address"
          placeholder="123 Main Street"
        >

      </div>

    </div>

    <!-- PAYMENT -->
    <h3>Card Information</h3>

    <div class="card-box">

      <div class="input-group">

        <label>Card Number</label>

        <input
          type="text"
          placeholder="1234 5678 9012 3456"
        >

      </div>

      <div class="card-row">

        <div class="input-group">

          <label>Expiration</label>

          <input
            type="text"
            placeholder="MM/YY"
          >

        </div>

        <div class="input-group">

          <label>CVC</label>

          <input
            type="text"
            placeholder="123"
          >

        </div>

      </div>

    </div>

    <!-- BUTTON -->
    <button id="placeOrder">

      🔒 Pay & Place Order

    </button>

  </div>

</div>

<!-- CONFIRMATION -->
<div id="confirmation" class="popup hidden">

  <div class="popup-box">

    <div class="success-icon">
      ✓
    </div>

    <h1>Order Confirmed</h1>

    <p>
      Your fresh artisan bread is now being prepared.
    </p>

    <button onclick="goHome()">
      Back to Home
    </button>

  </div>

</div>

<script src="checkout.js"></script>
<script src="main.js"></script>

</body>
</html>
